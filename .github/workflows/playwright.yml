name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      UI_BASE_URL: ${{ secrets.UI_BASE_URL || 'https://freelance-learn-automation.vercel.app' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://restful-booker.herokuapp.com' }}
      API_ADMIN_USERNAME: ${{ secrets.API_ADMIN_USERNAME || 'admin' }}
      API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD || 'password123' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: junit-results
        path: test-results/junit.xml
        retention-days: 30
